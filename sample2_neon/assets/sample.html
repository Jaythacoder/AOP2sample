<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Genomic Report | Ask of Pablo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0a0a0c; color: #e2e2e5; font-family: 'Space Grotesk', sans-serif; }
        .neon-border { border: 2px solid #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2); }
    </style>
</head>
<body class="p-12 flex justify-center">
    <div class="max-w-3xl w-full bg-gray-900 p-12 neon-border text-center">
        <h1 class="text-4xl font-bold text-neon mb-4 uppercase tracking-widest" style="font-family: 'Orbitron', sans-serif; color: #00f2ff;">Genomic Analysis Report</h1>
        <p class="text-gray-400 mb-8 italic">Verified Genetic Sequence: CGH-889-X</p>
        <div class="text-left space-y-4 mb-12 max-w-md mx-auto border-t border-b border-gray-700 py-8">
            <p><strong class="text-neon">Strain:</strong> Cyber-Glitch Haze</p>
            <p><strong class="text-neon">THC Level:</strong> 31.2%</p>
            <p><strong class="text-neon">CBD Level:</strong> 0.1%</p>
            <p><strong class="text-neon">Terpene Profile:</strong> Limonene / Myrcene / Caryophyllene</p>
        </div>
        <div class="flex justify-between items-end font-mono text-xs text-gray-500">
            <div>SIGNATURE: 0x4f2...a1b</div>
            <div>TIMESTAMP: 2026-09-27 14:20 UTC</div>
        </div>
    </div>
</body>
</html>
